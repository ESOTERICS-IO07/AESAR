<script>
  // Add some diagonal warning stripes in background
  const container = document.getElementById('warning-lines-container');
  if (container) {
    const stripes = document.createElement('div');
    stripes.className = 'absolute inset-0 opacity-10';
    stripes.style.backgroundImage = 'repeating-linear-gradient(45deg, transparent, transparent 20px, #000 20px, #000 40px)';
    container.appendChild(stripes);
  }

  // Handle Reset Hold
  const resetBtn = document.getElementById('btn-reset');
  if (resetBtn) {
    resetBtn.addEventListener('click', (e) => {
      // In a real app, this would trigger the actual reset flow
      const icon = resetBtn.querySelector('.material-symbols-outlined');
      const text = resetBtn.querySelector('span:not(.material-symbols-outlined)');
      
      icon.textContent = 'autorenew';
      icon.classList.add('animate-spin');
      text.textContent = 'INITIALIZING...';
      resetBtn.classList.add('pointer-events-none');
      
      setTimeout(() => {
        // Reset state back for demo purposes
        icon.textContent = 'power_settings_new';
        icon.classList.remove('animate-spin');
        text.textContent = 'RESET SYSTEM';
        resetBtn.classList.remove('pointer-events-none');
      }, 3000);
    });
  }
